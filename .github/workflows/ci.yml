name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 nmap
      - name: Install Genmap
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-qt
      - name: Run tests
        run: pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt
      - name: Build Genmap.exe
        env:
          QT_QPA_PLATFORM: offscreen
        run: python build_release.py --skip-tests
      - name: Check the executable starts
        run: dist\Genmap\Genmap.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: genmap-windows
          path: release/
