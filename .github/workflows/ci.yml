name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install Qt runtime libraries and Nmap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 nmap
      - name: Install Genmap
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-qt
      - name: Run tests
        run: pytest -q -ra
      - name: Self test from source
        run: python -m genmap --self-test selftest-source.json

  build-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt
      - name: Build Genmap.exe
        run: python build_release.py --skip-tests
      - name: Self test the packaged executable
        shell: pwsh
        run: |
          # Genmap.exe is a windowed program: PowerShell would not wait for it or
          # see its exit code unless it is started this way.
          $process = Start-Process -FilePath "dist\Genmap\Genmap.exe" -ArgumentList "--self-test", "selftest.json" -Wait -PassThru
          if (-not (Test-Path selftest.json)) { Write-Error "The executable did not write a self test report."; exit 1 }
          Get-Content selftest.json
          $report = Get-Content selftest.json | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or -not $report.ok -or -not $report.frozen) {
            Write-Error "Self test failed with exit code $($process.ExitCode)."
            exit 1
          }
      - uses: actions/upload-artifact@v6
        with:
          name: genmap-windows
          path: |
            release/
            selftest.json
          if-no-files-found: error
